# Save as: .github/workflows/space-shooter.yml
# Regenerates game.gif from the contribution graph every day.

name: space-shooter

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch: # manual run from the Actions tab
  push:
    branches:
      - main # runs once as soon as this file is committed

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2 # required: the action amends its own previous commit

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: "game.gif"
          strategy: "random" # column | row | random
          fps: 30
