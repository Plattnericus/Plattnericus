name: Profile assets

# Erzeugt Contribution-Graph, Activity-Graph und das Space-Shooter-GIF und
# veröffentlicht sie auf dem Branch `output`. Committet wird als
# github-actions[bot]: Die Updates zählen nicht zu den eigenen Contributions,
# und `main` bleibt frei von automatischen Commits.

on:
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-assets.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_USERNAME: ${{ github.repository_owner }}
      OUT_DIR: dist
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Schlägt ein Schritt fehl, bleibt auf `output` die letzte funktionierende Version stehen
      - name: Contribution graph
        continue-on-error: true
        run: node scripts/generate-contribution-graph.mjs

      - name: Activity graph
        continue-on-error: true
        run: node scripts/generate-activity-graph.mjs

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Space shooter
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet gh-space-shooter
          mkdir -p "$OUT_DIR"
          gh-space-shooter "$GITHUB_USERNAME" --output "$OUT_DIR/game.gif" --strategy random --fps 30

      - name: Publish to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$OUT_DIR" && cd "$OUT_DIR"
          git init -q -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          has_previous=false
          git fetch -q --depth=1 origin output 2>/dev/null && has_previous=true

          if $has_previous; then
            for f in contribution-graph.svg activity-graph.svg game.gif; do
              [ -s "$f" ] || git checkout -q FETCH_HEAD -- "$f" 2>/dev/null || true
            done
          fi

          git add -A
          if [ -z "$(git ls-files)" ]; then
            echo "::error::Keine Grafiken erzeugt."
            exit 1
          fi
          git commit -q -m "Update profile assets"

          if $has_previous && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "Keine Änderungen."
            exit 0
          fi

          # Immer genau ein Commit auf `output`, keine wachsende History
          git push -q -f origin output
