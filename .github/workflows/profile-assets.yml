name: Profile assets

# Erzeugt Contribution-Graph, Activity-Graph und das Space-Shooter-GIF und
# veröffentlicht sie über GitHub Pages. Dabei entsteht kein einziger Commit:
# Die Bilder im README werden einfach ersetzt und zählen nicht zu den Contributions.

on:
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-assets.yml"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write   # nur für den Keepalive-Schritt
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install gh-space-shooter
        continue-on-error: true
        run: pip install --quiet gh-space-shooter

      - name: Build assets
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build.sh

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      # Ohne Commits würde GitHub den Zeitplan nach 60 Tagen Inaktivität pausieren
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/profile-assets.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
