<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="528" viewBox="0 0 1200 528" role="img">
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Arial, sans-serif; letter-spacing: 0; text-rendering: geometricPrecision; }
  .rise { animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; }
  .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s cubic-bezier(.2, .8, .2, 1) forwards; }
  .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .nudge { animation: nudge 2.8s ease-in-out infinite; }
  .point { opacity: 1; animation: point .42s cubic-bezier(.2, .8, .2, 1) both; }
  .rot-0 { animation: rot0 12s ease-in-out infinite; }
  .rot-1 { opacity: 0; animation: rot1 12s ease-in-out infinite; }
  .rot-2 { opacity: 0; animation: rot2 12s ease-in-out infinite; }
  .rot-3 { opacity: 0; animation: rot3 12s ease-in-out infinite; }
  .status-line { stroke-dasharray: 92; stroke-dashoffset: 92; animation: draw 1.5s .25s cubic-bezier(.2, .8, .2, 1) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.04); } }
  @keyframes nudge { 0%, 100% { transform: translateX(0); opacity: .55; } 50% { transform: translateX(4px); opacity: 1; } }
  @keyframes point { from { opacity: 0; transform: translateY(4px) scale(.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes rot0 { 0%, 20% { opacity: 1; transform: translateY(0); } 25%, 95% { opacity: 0; transform: translateY(-6px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes rot1 { 0%, 20% { opacity: 0; transform: translateY(6px); } 25%, 45% { opacity: 1; transform: translateY(0); } 50%, 100% { opacity: 0; transform: translateY(-6px); } }
  @keyframes rot2 { 0%, 45% { opacity: 0; transform: translateY(6px); } 50%, 70% { opacity: 1; transform: translateY(0); } 75%, 100% { opacity: 0; transform: translateY(-6px); } }
  @keyframes rot3 { 0%, 70% { opacity: 0; transform: translateY(6px); } 75%, 95% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  
  <rect width="1200" height="528" rx="28" fill="#fbfbfd"/>
  <rect x="1" y="1" width="1198" height="526" rx="27" fill="none" stroke="#d2d2d7"/>
  <text x="76" y="82" fill="#1d1d1f" font-size="40" font-weight="700">Stack</text>
  <text x="76" y="112" fill="#6e6e73" font-size="17">Focused, practical, and built for real projects.</text>
  
  <g class="rise" style="animation-delay:0.00s">
    <rect x="76" y="128" width="1048" height="64" rx="18" fill="#ffffff" stroke="#e8e8ed"/>
    <text x="104" y="166" fill="#1d1d1f" font-size="20" font-weight="650">Systems</text>
    <text x="288" y="162" fill="#6e6e73" font-size="15" font-weight="500">Java, C#, C, C++</text>
    <text x="288" y="183" fill="#86868b" font-size="13">Typed software, low-level concepts, and hardware-adjacent work.</text>
    <text class="nudge" style="animation-delay:0.00s" x="1090" y="173" fill="#86868b" font-size="24" text-anchor="middle">›</text>
  </g>
  <g class="rise" style="animation-delay:0.04s">
    <rect x="76" y="206" width="1048" height="64" rx="18" fill="#ffffff" stroke="#e8e8ed"/>
    <text x="104" y="244" fill="#1d1d1f" font-size="20" font-weight="650">Interfaces</text>
    <text x="288" y="240" fill="#6e6e73" font-size="15" font-weight="500">JavaScript, TypeScript, React, Next.js, Svelte</text>
    <text x="288" y="261" fill="#86868b" font-size="13">Clean product surfaces with practical interaction design.</text>
    <text class="nudge" style="animation-delay:0.16s" x="1090" y="251" fill="#86868b" font-size="24" text-anchor="middle">›</text>
  </g>
  <g class="rise" style="animation-delay:0.08s">
    <rect x="76" y="284" width="1048" height="64" rx="18" fill="#ffffff" stroke="#e8e8ed"/>
    <text x="104" y="322" fill="#1d1d1f" font-size="20" font-weight="650">Data</text>
    <text x="288" y="318" fill="#6e6e73" font-size="15" font-weight="500">PostgreSQL, MySQL</text>
    <text x="288" y="339" fill="#86868b" font-size="13">Schemas, storage, and reliable application state.</text>
    <text class="nudge" style="animation-delay:0.32s" x="1090" y="329" fill="#86868b" font-size="24" text-anchor="middle">›</text>
  </g>
  <g class="rise" style="animation-delay:0.12s">
    <rect x="76" y="362" width="1048" height="64" rx="18" fill="#ffffff" stroke="#e8e8ed"/>
    <text x="104" y="400" fill="#1d1d1f" font-size="20" font-weight="650">Operations</text>
    <text x="288" y="396" fill="#6e6e73" font-size="15" font-weight="500">Linux, Node.js, Cisco, self-hosting</text>
    <text x="288" y="417" fill="#86868b" font-size="13">Local services, networking, and deployment routines.</text>
    <text class="nudge" style="animation-delay:0.48s" x="1090" y="407" fill="#86868b" font-size="24" text-anchor="middle">›</text>
  </g>
</svg>
